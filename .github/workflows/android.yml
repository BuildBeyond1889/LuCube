name: Android app
on:
  push:
    branches: [main]
    paths: ['phone/**', 'web/**', 'tests/**', 'blocks/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  # the APK only gets built (and offered to your phone) once the tap tests pass
  taps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Get the test browser
        working-directory: tests
        run: npm install --no-audit --no-fund && npx playwright install --with-deps chromium
      - name: Tap through the PC, iPad and iPhone
        run: tests/run.sh
  apk:
    needs: taps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Build the phone page
        working-directory: phone
        run: npm ci && python3 build_www.py && npx cap sync android
      - name: Build the APK
        working-directory: phone/android
        env: { LU_BUILD: '${{ github.run_number }}' }
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace > build.log 2>&1 || {
            grep -E "error:|e: |FAILURE|What went wrong|Could not|\.java:[0-9]+|AAPT|Execution failed" build.log | head -40 | while IFS= read -r l; do echo "::error::$l"; done
            tail -60 build.log
            exit 1; }
          cp app/build/outputs/apk/release/app-release.apk ../../LuCube.apk
      - name: Publish
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          # the release is never deleted (a phone downloading during a rebuild would get nothing): each build adds
          # LuCube-<build>.apk, which never changes once uploaded, and refreshes LuCube.apk for the website link
          N=${{ github.run_number }}
          cp LuCube.apk "LuCube-$N.apk"
          if gh release view phone-latest > /dev/null 2>&1; then
            gh release upload phone-latest "LuCube-$N.apk" --clobber
            gh release upload phone-latest LuCube.apk --clobber
            gh release edit phone-latest --title "Lu Cube for Android (build $N)" --latest
          else
            gh release create phone-latest "LuCube-$N.apk" LuCube.apk --title "Lu Cube for Android (build $N)" --notes "Install LuCube.apk on your Android phone (allow installing from your browser when it asks). Each new build installs over the last one and keeps your settings." --latest
          fi
          # keep the three newest numbered builds
          gh api "repos/${{ github.repository }}/releases/tags/phone-latest" --jq '.assets[] | select(.name | test("^LuCube-[0-9]+\\.apk$")) | "\(.id) \(.name)"' \
            | sort -t- -k2 -n | head -n -3 | while read -r id name; do gh api -X DELETE "repos/${{ github.repository }}/releases/assets/$id" && echo "removed $name"; done
