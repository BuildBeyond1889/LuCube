<title>How Rings Work</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;600&family=Space+Mono:wght@400;700&display=swap">
<style>
/* Layout: Lu Blocks' dark room. The cube unfolded flat on the left (so a ring reads as one straight line), the real cube turning on the right, the step card below. */
:root{
  --bg:#121419; --bg2:#1a1e26; --ink:#111; --panel:#cfd6df; --well:#aeb7c3; --text:#e9edf2; --mute:#8b93a1;
  --y:#ffc21a; --chg:#f3cd55; --o:#ff7a1a; --r:#e0281a; --b:#2f6be8; --g:#1fa36b; --p:#8b5cf6;
  --disp:'Anton',Impact,'Arial Narrow',sans-serif; --mono:'Space Mono',ui-monospace,Menlo,monospace; --body:'Inter',system-ui,-apple-system,sans-serif;
  --c:22px; --gap:2px; color-scheme:dark;
}
body{background:radial-gradient(120% 80% at 50% 30%,var(--bg2),var(--bg));color:var(--text);font-family:var(--body);min-height:100%}
.wrap{max-width:980px;margin:0 auto;padding-block:14px 28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
.bar{display:flex;align-items:center;gap:8px;background:var(--b);border:3px solid var(--ink);padding:6px 10px;box-shadow:0 4px 0 var(--ink)}
.sq{width:20px;height:20px;border:2px solid var(--ink);flex:none}.sq.r{background:var(--r)}.sq.y{background:var(--y)}.sq.o{background:var(--o)}
.bar h1{margin:0 0 0 6px;font:700 12px var(--mono);letter-spacing:.16em;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.bar h1 b{color:var(--y)}

.scene{display:grid;grid-template-columns:minmax(0,1fr) 220px;gap:18px;align-items:center}
@media (max-width:720px){.scene{grid-template-columns:minmax(0,1fr)}.cubebox{order:-1}}

/* the unfolded cube */
.netbox{overflow-x:auto;padding:28px 0 8px}
.net{display:grid;grid-template-columns:repeat(4,auto);grid-template-rows:repeat(3,auto);gap:24px 6px;width:max-content;margin:0 auto;position:relative}
.fc{position:relative;background:var(--panel);border:3px solid var(--ink);padding:4px;transition:box-shadow .3s}
.fc .gr{display:grid;grid-template-columns:repeat(5,var(--c));grid-auto-rows:var(--c);gap:var(--gap)}
.fc .tag{position:absolute;left:-3px;top:-19px;font:700 9px var(--mono);letter-spacing:.16em;color:var(--mute);white-space:nowrap}
.fc.front{box-shadow:0 0 0 3px var(--y)}
.fc.front .tag{color:var(--y)}
.fc.dim{opacity:.45}
.c{background:var(--well);border-radius:2px;position:relative;transition:background .2s}
.c.on{background:var(--k);box-shadow:inset 0 0 0 2px var(--ink),inset 0 -4px 0 rgba(0,0,0,.2);animation:drop .22s ease-out}
@keyframes drop{from{transform:translateY(-10px) scale(1.15);opacity:0}}
.c.chg:not(.on){background:var(--chg);box-shadow:inset 0 0 0 2px #c99400}
.c.on.chg{box-shadow:inset 0 0 0 2px var(--ink),inset 0 -4px 0 rgba(0,0,0,.2),0 0 0 2px var(--y)}
.c.pulse:not(.on){animation:hum 1.1s ease-in-out infinite;animation-delay:calc(var(--clock,0) * -1ms)}
@keyframes hum{50%{background:#ffe27e;box-shadow:inset 0 0 0 2px #c99400,0 0 12px rgba(255,194,26,.9)}}
.c.belt::after{content:"";position:absolute;inset:-3px;border:2px dashed var(--y);border-radius:3px}
.c.flash{animation:flash .5s ease-out forwards}
@keyframes flash{0%{filter:brightness(1);transform:scale(1)}30%{filter:brightness(2.4);transform:scale(1.18)}100%{filter:brightness(2.6);transform:scale(.2);opacity:0}}
.wrapnote{grid-column:3/5;grid-row:3;align-self:start;justify-self:end;text-align:right;font:700 10px/1.5 var(--mono);letter-spacing:.1em;color:var(--y);pointer-events:none;max-width:24ch}

/* the real cube */
.cubebox{height:220px;display:grid;place-items:center;perspective:900px}
.cube{width:118px;height:118px;position:relative;transform-style:preserve-3d;animation:turn 14s linear infinite}
@keyframes turn{from{transform:rotateX(-22deg) rotateY(0)}to{transform:rotateX(-22deg) rotateY(-360deg)}}
.cube .fc{position:absolute;inset:0;padding:3px;box-sizing:border-box;backface-visibility:hidden}
.cube .fc .gr{grid-template-columns:repeat(5,1fr);grid-auto-rows:1fr;height:100%;gap:2px}
.cube .fc .tag{display:none}
.cube .fF{transform:translateZ(59px)}.cube .fR{transform:rotateY(90deg) translateZ(59px)}.cube .fB{transform:rotateY(180deg) translateZ(59px)}
.cube .fL{transform:rotateY(-90deg) translateZ(59px)}.cube .fU{transform:rotateX(90deg) translateZ(59px)}.cube .fD{transform:rotateX(-90deg) translateZ(59px)}
.cube .fc.front{box-shadow:none}
.cube .c.belt::after{inset:-2px}

.card{background:var(--panel);color:var(--ink);border:3px solid var(--ink);box-shadow:0 6px 0 var(--ink);display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 18px;padding:16px 18px}
.card .no{font:700 10px var(--mono);letter-spacing:.18em;color:#4b525d;grid-column:1/-1}
.card h2{margin:0;font:400 34px/1 var(--disp);letter-spacing:.01em;text-wrap:balance}
.card p{margin:4px 0 0;font:400 15px/1.55 var(--body);max-width:62ch;grid-column:1}
.pips{grid-column:2;grid-row:2/4;display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.pips .lab{font:700 9px var(--mono);letter-spacing:.16em;color:#4b525d}
.pips .row{display:flex;gap:5px}
.pip{width:30px;height:30px;border:2px solid var(--ink);background:var(--well);display:grid;place-items:center;font:700 10px var(--mono)}
.pip.on{background:var(--chg)}
.score{font:400 28px/1 var(--disp);font-variant-numeric:tabular-nums}
.fc.front .tag::after{content:" · IN FRONT"}
@media (max-width:560px){.fc.front .tag::after{content:""}.card{grid-template-columns:minmax(0,1fr)}.pips{grid-column:1;grid-row:auto;align-items:flex-start;flex-direction:row;flex-wrap:wrap;align-items:center;gap:10px}.card h2{font-size:28px}}

.ctl{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.btn{background:#f4f6f9;border:3px solid var(--ink);box-shadow:0 3px 0 var(--ink);font:700 12px var(--mono);letter-spacing:.14em;padding:10px 16px;cursor:pointer;color:var(--ink)}
.btn.go{background:var(--y)}
.btn:disabled{opacity:.4;cursor:default}
.btn:focus-visible,.dot:focus-visible{outline:3px solid #fff;outline-offset:2px}
.dots{display:flex;gap:6px;margin-left:auto}
.dot{width:12px;height:12px;border:2px solid var(--ink);background:#3a414d;padding:0;cursor:pointer}
.dot.on{background:var(--y)}
.toast{position:fixed;left:50%;top:42%;transform:translate(-50%,-50%);pointer-events:none;text-align:center;opacity:0;z-index:5}
.toast.go{animation:toast 1.3s ease-out}
.toast .t1{font:400 46px/1 var(--disp);color:var(--y);-webkit-text-stroke:2px var(--ink);text-shadow:0 4px 0 var(--ink);white-space:nowrap}
.toast .t2{font:700 13px var(--mono);letter-spacing:.14em;color:#fff;background:var(--ink);display:inline-block;padding:3px 8px;margin-top:4px}
@keyframes toast{0%{opacity:0;transform:translate(-50%,-30%) scale(.7)}15%{opacity:1;transform:translate(-50%,-50%) scale(1.08)}75%{opacity:1}100%{opacity:0;transform:translate(-50%,-70%)}}
@media (prefers-reduced-motion:reduce){.cube{animation:none;transform:rotateX(-22deg) rotateY(-30deg)}.c.pulse:not(.on),.c.on{animation:none}}
</style>

<div class="wrap">
  <div class="bar"><span class="sq r"></span><span class="sq y"></span><span class="sq o"></span><h1>LU.BLOCKS // <b>HOW RINGS WORK</b></h1></div>

  <div class="scene">
    <div class="netbox"><div class="net" id="net"></div></div>
    <div class="cubebox" aria-label="The same cube, folded up and turning"><div class="cube" id="cube"></div></div>
  </div>

  <div class="card" aria-live="polite">
    <div class="no" id="no"></div>
    <h2 id="title"></h2>
    <p id="text"></p>
    <div class="pips"><div class="lab">MIDDLE RING CHARGED</div><div class="row" id="pips"></div><div class="lab">SCORE</div><div class="score" id="score">0</div></div>
  </div>

  <div class="ctl">
    <button class="btn" id="back">Back</button>
    <button class="btn go" id="next">Next</button>
    <button class="btn" id="again">Play this step again</button>
    <div class="dots" id="dots"></div>
  </div>
</div>
<div class="toast" id="toast"><div class="t1" id="t1"></div><div class="t2" id="t2"></div></div>

<script>
(() => {
'use strict';
const N = 5, BELT = ['L', 'F', 'R', 'B'], ALL = ['U', 'L', 'F', 'R', 'B', 'D'];
const NAME = { U: 'TOP', L: 'LEFT', F: 'FRONT', R: 'RIGHT', B: 'BACK', D: 'BOTTOM' };
const POS = { U: [2, 1], L: [1, 2], F: [2, 2], R: [3, 2], B: [4, 2], D: [2, 3] }; // grid column, row in the unfolded cross
const COL = ['#2f6be8', '#e0281a', '#1fa36b', '#ff7a1a', '#8b5cf6', '#ffc21a'];
const RING = 2; // the middle row

// ---------- state ----------
let S;
const fresh = () => ({ cells: {}, charged: new Set(), front: 'F', belt: false, pulse: false, flash: new Set(), score: 0, dim: false });
const key = (f, r, c) => f + r + c;
const fill = (f, r, c, k) => (S.cells[key(f, r, c)] = k);

// ---------- drawing ----------
const els = { net: {}, cube: {} };
function build(root, which) {
  for (const f of ALL) {
    const fc = document.createElement('div'); fc.className = 'fc f' + f;
    if (which === 'net') { fc.style.gridColumn = POS[f][0]; fc.style.gridRow = POS[f][1]; }
    const tag = document.createElement('div'); tag.className = 'tag'; tag.textContent = NAME[f]; fc.appendChild(tag);
    const gr = document.createElement('div'); gr.className = 'gr';
    const list = [];
    for (let i = 0; i < N * N; i++) { const c = document.createElement('i'); c.className = 'c'; gr.appendChild(c); list.push(c); }
    fc.appendChild(gr); root.appendChild(fc);
    els[which][f] = { fc, list };
  }
}
build(document.getElementById('net'), 'net');
build(document.getElementById('cube'), 'cube');
{ // "keeps going" notes at both ends of the ring
  const net = document.getElementById('net');
  const a = document.createElement('div'); a.className = 'wrapnote'; a.id = 'wrapR'; a.textContent = 'Off the right edge of the back, the row comes round onto the left again'; net.appendChild(a);
}

function draw() {
  document.documentElement.style.setProperty('--clock', Math.round(performance.now() % 1100));
  for (const w of ['net', 'cube']) for (const f of ALL) {
    const { fc, list } = els[w][f];
    fc.classList.toggle('front', S.front === f);
    fc.classList.toggle('dim', S.dim && !BELT.includes(f));
    for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
      const el = list[r * N + c], k = S.cells[key(f, r, c)], inRing = r === RING && BELT.includes(f);
      let cls = 'c';
      if (k) cls += ' on';
      if (inRing && S.charged.has(f)) cls += ' chg' + (S.pulse ? ' pulse' : '');
      if (inRing && S.belt) cls += ' belt';
      if (S.flash.has(key(f, r, c))) cls += ' flash';
      if (el.className !== cls) el.className = cls;
      el.style.setProperty('--k', k || '');
    }
  }
  const p = document.getElementById('pips'); p.innerHTML = '';
  for (const f of ['F', 'R', 'B', 'L']) { const d = document.createElement('div'); d.className = 'pip' + (S.charged.has(f) ? ' on' : ''); d.textContent = f; d.title = NAME[f]; p.appendChild(d); }
  document.getElementById('score').textContent = S.score;
  placeNote();
}
function placeNote() { document.getElementById('wrapR').hidden = !S.belt; }
function size() {
  const w = document.querySelector('.netbox').clientWidth;
  const c = Math.max(7, Math.min(26, Math.floor((w - 112) / 20))); // four faces across: 20 squares plus borders, padding and gaps
  document.documentElement.style.setProperty('--c', c + 'px');
  draw();
}
addEventListener('resize', size);
function toast(a, b) { const t = document.getElementById('toast'); document.getElementById('t1').textContent = a; document.getElementById('t2').textContent = b; t.classList.remove('go'); void t.offsetWidth; t.classList.add('go'); }

// ---------- the story ----------
const fillRow = (f, t0, gap, skip = []) => [0, 1, 2, 3, 4].filter((c) => !skip.includes(c)).map((c, j) => [t0 + j * gap, () => fill(f, RING, c, COL[(c + f.charCodeAt(0)) % COL.length])]);
const clearRow = (f) => { for (let c = 0; c < N; c++) delete S.cells[key(f, RING, c)]; S.flash = new Set(); };
const flashRow = (f) => { S.flash = new Set([0, 1, 2, 3, 4].map((c) => key(f, RING, c))); };
const blast = () => { for (const f of BELT) for (let c = 0; c < N; c++) delete S.cells[key(f, RING, c)]; S.charged.clear(); S.pulse = false; S.flash = new Set(); S.score += 500; };
const flashBelt = () => { S.flash = new Set(BELT.flatMap((f) => [0, 1, 2, 3, 4].map((c) => key(f, RING, c)))); };
const crowd = () => {
  const pat = { U: [[0, 0], [0, 1], [1, 0], [1, 1], [1, 2], [3, 3], [3, 4], [4, 3], [4, 4], [4, 0]], D: [[0, 2], [0, 3], [1, 2], [1, 3], [3, 0], [4, 0], [4, 1], [4, 4]],
    F: [[0, 0], [0, 1], [0, 2], [1, 0], [1, 1], [3, 0], [3, 1], [3, 2], [3, 3], [4, 0], [4, 1], [4, 2], [4, 4], [2, 0], [2, 1], [2, 3]],
    R: [[0, 1], [0, 2], [0, 3], [1, 1], [1, 2], [3, 0], [3, 1], [4, 0], [4, 1], [4, 2], [4, 3], [2, 2]],
    B: [[0, 0], [1, 0], [1, 3], [1, 4], [3, 2], [3, 3], [3, 4], [4, 2], [4, 3], [4, 4], [2, 4]],
    L: [[0, 3], [0, 4], [1, 3], [1, 4], [3, 0], [3, 1], [3, 2], [4, 0], [4, 1], [4, 2], [4, 3]] };
  S.cells = {}; for (const f in pat) pat[f].forEach(([r, c], i) => fill(f, r, c, COL[(i + f.charCodeAt(0)) % COL.length]));
  S.charged = new Set(['F', 'R', 'B']); S.pulse = true; S.front = 'L'; S.belt = false; S.dim = false;
};

const STEPS = [
  { t: 'A ring is a loop around the cube',
    p: 'Rows don\'t stop at the edge of a face. The middle row of the front carries on across the right face, the back and the left, then comes back round to the front. Those four rows are one ring: 20 squares. Columns make rings too, going over the top and under the bottom.',
    a: [[0, () => { S.belt = true; S.dim = true; }]] },
  { t: 'Fill a line on the face in front',
    p: 'You only ever play on the face pointing at you. Here the front face is in front, and its middle row is filling up with blocks.',
    a: [[0, () => { S.belt = false; S.dim = false; S.front = 'F'; }], ...fillRow('F', 350, 300)] },
  { t: 'It clears and turns yellow',
    p: 'A full row clears like any block game. Its squares stay yellow afterwards: that\'s one of the ring\'s four lines charged.',
    a: [[200, () => flashRow('F')], [700, () => { clearRow('F'); S.charged.add('F'); S.score += 50; }]] },
  { t: 'Turn the cube and do it again',
    p: 'Turn the right face to the front and clear its middle row: two of four. Then the back: three of four. Each face\'s matching row is the same ring, so the yellow keeps lining up.',
    a: [[0, () => { S.front = 'R'; }], ...fillRow('R', 300, 220), [1500, () => flashRow('R')], [1950, () => { clearRow('R'); S.charged.add('R'); S.score += 50; }],
        [2500, () => { S.front = 'B'; }], ...fillRow('B', 2800, 220), [4000, () => flashRow('B')], [4450, () => { clearRow('B'); S.charged.add('B'); S.score += 50; }]] },
  { t: 'Three of four: the ring pulses',
    p: 'With three lines charged, the whole ring pulses to tell you it\'s one line from going off. Blocks you put on yellow squares don\'t take the charge away; they just sit there until the blast.',
    a: [[0, () => { S.pulse = true; S.front = 'F'; }], [700, () => fill('F', RING, 1, '#e0281a')], [1000, () => fill('F', RING, 3, '#2f6be8')], [1300, () => fill('B', RING, 0, '#1fa36b')]] },
  { t: 'Clear the last line: ring blast',
    p: 'Turn the left face round and clear its middle row. The ring is now charged on all four faces, so all 20 squares blast at once, taking every block in the ring with them, on every face. +500, and the ring starts again from nothing.',
    a: [[0, () => { S.front = 'L'; }], ...fillRow('L', 350, 260), [1800, flashBelt], [2350, () => { blast(); toast('RING BLAST', '+500'); }]] },
  { t: 'Why you chase them',
    p: 'When the faces fill up, a blast is the only move that opens room on four faces at once. The game only ends when none of the three blocks in your tray fits anywhere on any face, so a pulsing ring is often what keeps you alive.',
    a: [[0, crowd], [1200, () => { fill('L', RING, 0, '#ff7a1a'); fill('L', RING, 1, '#ff7a1a'); fill('L', RING, 2, '#ff7a1a'); }], [1600, () => { fill('L', RING, 3, '#8b5cf6'); fill('L', RING, 4, '#8b5cf6'); }], [2200, flashBelt], [2750, () => { blast(); toast('ROOM AGAIN', '4 FACES OPENED'); }]] },
];

let step = 0, timers = [];
function stateBefore(k) { S = fresh(); for (let i = 0; i < k; i++) STEPS[i].a.forEach(([, fn]) => fn()); S.flash = new Set(); }
function go(k) {
  timers.forEach(clearTimeout); timers = [];
  step = Math.max(0, Math.min(STEPS.length - 1, k));
  stateBefore(step);
  const st = STEPS[step];
  document.getElementById('no').textContent = `STEP ${step + 1} OF ${STEPS.length}`;
  document.getElementById('title').textContent = st.t;
  document.getElementById('text').textContent = st.p;
  document.getElementById('back').disabled = step === 0;
  const nx = document.getElementById('next'); nx.textContent = step === STEPS.length - 1 ? 'Start over' : 'Next';
  document.querySelectorAll('.dot').forEach((d, i) => d.classList.toggle('on', i === step));
  draw();
  st.a.forEach(([ms, fn]) => timers.push(setTimeout(() => { fn(); draw(); }, ms)));
}
const dots = document.getElementById('dots');
STEPS.forEach((s, i) => { const d = document.createElement('button'); d.className = 'dot'; d.setAttribute('aria-label', `Step ${i + 1}: ${s.t}`); d.onclick = () => go(i); dots.appendChild(d); });
document.getElementById('back').onclick = () => go(step - 1);
document.getElementById('next').onclick = () => go(step === STEPS.length - 1 ? 0 : step + 1);
document.getElementById('again').onclick = () => go(step);
addEventListener('keydown', (e) => { if (e.key === 'ArrowRight') go(step + 1); if (e.key === 'ArrowLeft') go(step - 1); });

S = fresh();
size();
go(0);
})();
</script>
