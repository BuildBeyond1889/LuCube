<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lu Cube</title>
<style>@font-face{font-family:Anton;src:url(fonts/anton-latin-400-normal.woff2) format("woff2")}@font-face{font-family:"Space Mono";font-weight:400;src:url(fonts/space-mono-latin-400-normal.woff2) format("woff2")}@font-face{font-family:"Space Mono";font-weight:700;src:url(fonts/space-mono-latin-700-normal.woff2) format("woff2")}@font-face{font-family:Inter;font-weight:400;src:url(fonts/inter-latin-400-normal.woff2) format("woff2")}@font-face{font-family:Inter;font-weight:600;src:url(fonts/inter-latin-600-normal.woff2) format("woff2")}.qbtn{width:24px;height:24px;padding:0!important;border-radius:50%!important;border:1px solid rgba(255,194,26,.65)!important;background:#0b0d14!important;color:#ffc21a!important;font:700 11px/22px 'Space Mono',monospace!important;text-align:center;box-shadow:0 0 12px rgba(255,194,26,.25)}

<style>
:root{--y:#ffc21a;--o:#ff7a1a;--r:#e0281a;--b:#2f6be8;--g:#cfd6df;--g2:#b9c1cc;--k:#111}
*{box-sizing:border-box}html,body{height:100%;margin:0}body{background:#0b0c0e;color:#ddd;font:13px Inter,sans-serif;overflow:hidden;user-select:none}
.desk{position:fixed;inset:0;background:radial-gradient(ellipse at 30% 30%,#1b1f26,#0b0c0e 70%)}

.win:before{content:"";display:block;height:30px;border-bottom:1px solid #2a2f37}.win i{display:block;height:10px;margin:16px 22px 0;background:#232831;border-radius:4px}.win i:nth-child(2){width:60%}.win i:nth-child(3){width:75%}
.intro{position:fixed;left:24px;top:18px;z-index:3;max-width:520px}.intro h1{margin:0;font:400 30px Anton,sans-serif;text-transform:uppercase;color:#fff}.intro h1 em{font-style:normal;color:var(--y)}.intro p{margin:6px 0 0;color:#8a919c}
.keys{position:fixed;left:24px;bottom:16px;color:#6b727d;font:11px "Space Mono",monospace;z-index:3}
.wheelUI{transition:opacity .45s ease,transform .45s ease}.ring.wheelUI,.back.wheelUI,.qbtn.wheelUI{transition:opacity .45s ease}body.cubemode .wheelUI{opacity:0!important;pointer-events:none!important;transform:translateX(40px)}
canvas#wheel{position:fixed;inset:0;width:100%;height:100%;z-index:4;pointer-events:none}
#toks .tok{touch-action:none;position:fixed;left:0;top:0;width:96px;height:96px;margin:-48px 0 0 -48px;border-radius:50%;z-index:6;cursor:pointer;overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,.5);will-change:transform;transition:opacity .3s}
.tok .art{position:absolute;inset:0;border-radius:50%}.tok.play:after{content:"";position:absolute;inset:0;border-radius:50%;box-shadow:inset 0 0 0 4px #ffc21a}

.now{text-shadow:0 1px 2px #000,0 0 14px rgba(0,0,0,.85),0 0 4px rgba(0,0,0,.9)}.now small{display:block;font:700 10px "Space Mono",monospace;color:#9aa1ab;letter-spacing:.12em;margin-bottom:4px}.now svg{display:block;margin:2px 0 0 auto}.now em{display:block;font:400 13px Inter;color:#9aa1ab;text-transform:none;font-style:normal;margin-top:4px}
html.dk,html.dk body{background:transparent!important}html.dk .desk,html.dk .intro,html.dk .keys{display:none}
.qbtn{position:fixed;left:0;top:0;z-index:8;font:700 11px "Space Mono",monospace;background:#111;color:#ddd;border:1px solid #444;border-radius:99px;padding:6px 10px;cursor:pointer;display:none}html.dk .qbtn{display:block}
.back{position:fixed;z-index:8;font:700 11px "Space Mono",monospace;background:#111;color:#ddd;border:1px solid #444;border-radius:99px;padding:6px 12px;cursor:pointer;left:0;top:0}
.ring{position:fixed;left:0;top:0;z-index:5;pointer-events:none;width:132px;height:132px;margin:0}
.stage{position:fixed;inset:0;perspective:1600px;z-index:8;pointer-events:none}.cubeHold{position:absolute;left:0;top:0;width:0;height:0;transform-style:preserve-3d;pointer-events:none}.pad{position:fixed;left:0;top:0;z-index:10;width:330px;height:330px;margin:-165px 0 0 -165px;cursor:grab;touch-action:none;display:none}.pad.hand{cursor:pointer}

.f{position:absolute;left:-150px;top:-150px;width:300px;height:300px;overflow:hidden;background:var(--g);color:var(--k);border:2px solid var(--k);backface-visibility:hidden;font:10px "Space Mono",monospace}
.f.fr{transform:translateZ(150px)}.f.bk{transform:rotateY(180deg) translateZ(150px)}.f.rt{transform:rotateY(90deg) translateZ(150px)}.f.lf{transform:rotateY(-90deg) translateZ(150px)}.f.tp{transform:rotateX(90deg) translateZ(150px)}.f.bt{transform:rotateX(-90deg) translateZ(150px)}
/* retro window chrome */
.tb{display:flex;align-items:center;gap:4px;height:20px;padding:0 6px;background:var(--b);color:#fff;border-bottom:2px solid var(--k);font:700 9px "Space Mono",monospace;letter-spacing:.06em}
.tb i{width:8px;height:8px;border:1.5px solid var(--k);display:inline-block}.tb i:nth-child(1){background:var(--r)}.tb i:nth-child(2){background:var(--y)}.tb i:nth-child(3){background:var(--o)}.tb b{margin-left:6px;flex:1}.tb s{text-decoration:none;font-size:13px;padding:0 3px;cursor:pointer}.vol{display:flex;align-items:center;gap:8px;margin:2px 10px 0}.vol b{width:34px;height:26px;border:2px solid var(--k);display:grid;place-items:center;background:#fff;font-size:13px}.vol .vb{flex:1;height:12px;border:2px solid var(--k);background:#fff}.vol .vb i{display:block;height:100%;background:var(--b)}.star{position:absolute;right:10px;top:30px;width:34px;height:34px;border:2px solid var(--k);background:#fff;display:grid;place-items:center;font-size:20px;line-height:1}.star.on{background:var(--k);color:var(--y)}.star.shuf{top:70px;font-size:18px}
.bars{display:flex;height:9px}.bars span{flex:1;border-right:1.5px solid var(--k)}.bars span:last-child{border:0}
.big{font:400 46px/0.88 Anton,sans-serif;text-transform:uppercase;letter-spacing:-.01em}.mid{font:400 22px/1 Anton,sans-serif;text-transform:uppercase}
.mini{position:fixed;left:0;top:0;z-index:11;pointer-events:none;display:grid;place-items:center;background:var(--y);color:var(--k);border:3px solid var(--k);font:400 40px/1 Anton,sans-serif;opacity:0;transition:opacity .25s}.mini.on{opacity:1}
.opts{display:flex;gap:6px;margin:8px 10px 0}.opts .pill{cursor:pointer}.pill{display:inline-block;background:var(--k);color:#fff;border-radius:99px;padding:3px 10px;font:700 8px "Space Mono",monospace;letter-spacing:.08em}
.code{display:flex;gap:1.5px;height:16px;align-items:stretch}.code i{background:var(--k);display:block}
.hex{width:62px;height:62px;position:relative}.hex:before{content:"";position:absolute;inset:0;background:var(--k);clip-path:polygon(25% 4%,75% 4%,100% 50%,75% 96%,25% 96%,0 50%)}.hex:after{content:"";position:absolute;inset:20px;border-radius:50%;background:var(--g);box-shadow:0 0 0 6px var(--k) inset}
.lyr{padding:14px 14px 0;transition:transform .4s}.lyr div{font:400 19px/1.18 Anton,sans-serif;text-transform:uppercase;color:#7d8794;transition:color .4s,transform .4s}.lyr div.on{color:var(--k);transform:translateX(6px)}.lyr div.on:before{content:"▶ ";color:var(--r);font-size:13px}
.lib{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;padding:8px}.lib div{aspect-ratio:1;min-width:0;overflow:hidden;border:2px solid var(--k);display:flex;align-items:flex-end;padding:4px;font:400 11px/1 Anton,sans-serif;text-transform:uppercase}
.pl{padding:6px 8px}.pl div{display:flex;justify-content:space-between;align-items:center;padding:5px 6px;border-bottom:1.5px solid var(--g2);font:700 10px "Space Mono",monospace}.pl div.on{background:var(--y);border:2px solid var(--k)}.pl span:first-child b{font:400 14px Anton,sans-serif;text-transform:uppercase;margin-right:6px}
.viz{display:flex;align-items:flex-end;gap:5px;height:150px;padding:0 10px}.viz i{flex:1;background:var(--k);display:block;transition:height .08s}.viz i:nth-child(4n+1){background:var(--r)}.viz i:nth-child(4n+2){background:var(--o)}.viz i:nth-child(4n+3){background:var(--y)}
.prog{height:16px;cursor:pointer;border:2px solid var(--k);background:#fff;margin:0 10px}.prog i{display:block;height:100%;background:var(--r)}
.ctrl{display:flex;justify-content:center;gap:10px;margin:10px 0}.ctrl b{width:44px;height:34px;border:2px solid var(--k);display:grid;place-items:center;font-size:14px;background:#fff}.ctrl b.p{background:var(--y);width:60px}

[data-act]{cursor:pointer}[data-act].hov{outline:2px solid var(--k);outline-offset:-2px;filter:brightness(1.06)}
.pl div[data-act].hov{background:#fff}.lib div[data-act]{position:relative}.lib div span{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;overflow:hidden;overflow-wrap:anywhere;max-width:100%}.lib div.on{box-shadow:inset 0 0 0 4px var(--k)}
.scr{position:absolute;right:6px;top:26px;display:flex;flex-direction:column;gap:4px;z-index:2}.scr b{width:22px;height:20px;border:2px solid var(--k);background:#fff;display:grid;place-items:center;font-size:9px}.scr b.off{opacity:.3}.f .pl{padding-right:34px}.f .lib{margin-right:30px}
.hnd{position:fixed;left:0;top:0;width:16px;height:16px;margin:-8px 0 0 -8px;border-radius:50%;background:var(--y);border:2px solid #111;box-shadow:0 0 0 2px rgba(255,194,26,.25);z-index:12;cursor:nwse-resize;opacity:0;transition:opacity .35s,transform 0s;touch-action:none;pointer-events:none}.hnd.on{opacity:1;pointer-events:auto}.hnd:hover{background:#fff}
.vizc{position:absolute;left:50%;top:58%;width:170px;height:170px;margin:-85px 0 0 -85px;border-radius:50%}
/* weather + time of day, laid over the cube's faces */
.f:before,.f:after{content:"";position:absolute;inset:0;pointer-events:none;z-index:20;transition:opacity 1.5s,background 1.5s}
body.ph-night .f:before{background:linear-gradient(160deg,rgba(20,30,90,.42),rgba(5,8,30,.35));mix-blend-mode:multiply}
body.ph-dusk .f:before{background:linear-gradient(160deg,rgba(255,110,60,.22),rgba(110,40,140,.25));mix-blend-mode:multiply}
body.ph-dawn .f:before{background:linear-gradient(200deg,rgba(255,170,120,.2),rgba(120,160,255,.15));mix-blend-mode:multiply}
body.ph-day.wx-clear .f:after{background:radial-gradient(circle at 92% 6%,rgba(255,250,210,.55),transparent 38%)}
body.wx-cloud .f:after{background:linear-gradient(180deg,rgba(200,205,215,.28),rgba(120,125,135,.12))}
body.wx-fog .f:after{background:linear-gradient(180deg,rgba(225,228,235,.35),rgba(225,228,235,.18))}
body.wx-rain .f:after,body.wx-storm .f:after{background:repeating-linear-gradient(103deg,transparent 0 13px,rgba(190,215,255,.32) 13px 14px,transparent 14px 31px);background-size:62px 62px;animation:rain .55s linear infinite}
body.wx-storm .f:before{animation:flash 7s infinite}
body.wx-snow .f:after{background-image:radial-gradient(circle,rgba(255,255,255,.95) 0 1.6px,transparent 2.2px),radial-gradient(circle,rgba(255,255,255,.7) 0 1.1px,transparent 1.6px);background-size:46px 46px,29px 29px;animation:snow 4s linear infinite}
@keyframes rain{to{background-position:-14px 62px}}@keyframes snow{to{background-position:12px 46px,-8px 58px}}@keyframes flash{0%,92%,96%,100%{background:transparent}93%,95%{background:rgba(255,255,255,.55)}}
</style></head><body>
<div class="desk"></div>
<div class="intro"><h1>Lu <em>Cube</em></h1><p id="libinfo">Reading your Music folder…</p></div>
<canvas id="wheel" class="wheelUI"></canvas><div id="toks" class="wheelUI"></div>
<svg class="ring wheelUI" id="ring" viewBox="0 0 132 132"><circle cx="66" cy="66" r="61" fill="none" stroke="#333" stroke-width="3"/><circle id="ringp" cx="66" cy="66" r="61" fill="none" stroke="#ffc21a" stroke-width="3" stroke-linecap="round" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1" transform="rotate(-90 66 66)"/></svg>
<div class="now wheelUI" id="now"><small id="nowk">PLAYLIST</small><span id="nowt"></span><svg width="260" height="14" viewBox="0 0 260 14"><path id="squig" fill="none" stroke="#e0281a" stroke-width="3" stroke-linecap="round"/></svg><em id="nowsub"></em></div>
<button class="back wheelUI" id="back" style="display:none">‹ PLAYLISTS</button><button class="qbtn wheelUI" id="qbtn" title="close Lu Cube">✕</button>
<div class="stage" id="stage"><div class="cubeHold" id="hold"><div class="cube" id="cube">
 <div class="f fr" data-n="COVER" id="F_COVER"></div><div class="f bk" data-n="NOW PLAYING" id="F_NOW"></div><div class="f tp" data-n="LYRICS" id="F_LYR"></div>
 <div class="f bt" data-n="VISUALISER" id="F_VIZ"></div><div class="f rt" data-n="LIBRARY" id="F_LIB"></div><div class="f lf" data-n="PLAYLIST" id="F_PL"></div></div></div></div>
<div class="pad" id="pad"></div><div class="mini" id="mini">▶</div><div class="cname" id="cname" style="display:none"></div><button class="dock" id="dock" style="display:none">⇢ BACK TO THE WHEEL</button>
<div class="keys">SCROLL to move · CLICK to open / play · ESC goes back · CTRL+DRAG moves the wheel or the cube · drag a cube CORNER to resize · DRAG the wheel out → cube · drag the cube to spin, click its buttons, scroll over it to turn a face</div>
<script>
// ===================== music (all made up for the concept) =====================
const PAL=['#ffc21a','#ff7a1a','#e0281a','#2f6be8','#cfd6df','#111'];
const ART=(i,k)=>{const a=PAL[i%6],b=PAL[(i+2)%6],c=PAL[(i+3)%6],s=[`linear-gradient(${a} 0 38%,${b} 38% 55%,${c} 55%)`,`repeating-linear-gradient(135deg,${a} 0 12px,${b} 12px 18px)`,`radial-gradient(circle,#111 0 18%,${a} 18% 46%,${b} 46% 60%,#111 60%)`,`conic-gradient(${a} 0 25%,${b} 25% 50%,${a} 50% 75%,${b} 75%)`,`linear-gradient(90deg,${a} 0 50%,${b} 50%)`,`repeating-radial-gradient(circle,${a} 0 6px,${c} 6px 9px)`,`linear-gradient(45deg,${a} 0 33%,#fff 33% 66%,${b} 66%)`];return s[(i+k)%s.length]};
let PLS=[];
const P={pl:0,idx:0,playing:false,el:0,has:false};let AU=new Audio(),AU2=new Audio();AU.preload=AU2.preload='auto';
let UVOL=1,sleepF=1,XF=0,xf=null,SLEEP=null,MINI=false;
// listen to whichever player is the current one (the other may still be fading out the last song)
const ON=(ev,fn)=>[AU,AU2].forEach(el=>el.addEventListener(ev,e=>{if(e.target===AU)fn(e)}));
function mix(){const b=UVOL*sleepF;if(xf){const u=Math.min(1,(performance.now()-xf.t0)/xf.dur);AU.volume=b*u;xf.old.volume=b*(1-u)}else AU.volume=b}
const song=()=>(PLS[P.pl]||{songs:[{t:'',a:'',d:0}]}).songs[P.idx]||{t:'',a:'',d:0};
const short=(s,n)=>s.length>n?s.slice(0,n-1)+'…':s;
// lyrics: a song.lrc next to the song gives synced lines; classical pieces show the piece's details instead
async function loadLrc(s){if(s.lines!==undefined)return;s.lines=null;if(!s.lrc)return;try{const t=await (await fetch(s.lrc)).text(),L=[];t.split(/\r?\n/).forEach(l=>{const m=[...l.matchAll(/\[(\d+):(\d+(?:\.\d+)?)\]/g)],txt=l.replace(/\[[^\]]*\]/g,'').trim();m.forEach(x=>L.push({t:+x[1]*60+ +x[2],x:txt}))});L.sort((a,b)=>a.t-b.t);s.lines=L.length?L:null;renderFaces()}catch(e){}}
const LYR=s=>s.lines?s.lines.map(l=>l.x||'♪'):[short(s.t,22),s.a||'',PLS[P.pl]?short(PLS[P.pl].n,22):'','','INSTRUMENTAL','NO LYRICS FOR','THIS PIECE'];
let AC=null,AN=null,FQ=null;function audioGraph(){if(AC)return;try{AC=new AudioContext();AN=AC.createAnalyser();AN.fftSize=256;FQ=new Uint8Array(AN.frequencyBinCount);[AU,AU2].forEach(el=>AC.createMediaElementSource(el).connect(AN));AN.connect(AC.destination)}catch(e){AC=1}}
function stopXf(){if(xf){xf.old.pause();xf=null;mix()}}
function play(pl,idx,at,paused){stopXf();P.pl=pl;P.idx=idx;P.el=at||0;P.has=true;const s=song();if(!paused){audioGraph();if(AC&&AC.resume)AC.resume()}AU.src=s.src;
 if(at)AU.addEventListener('loadedmetadata',()=>{AU.currentTime=at},{once:true});
 mix();if(!paused){AU.play().catch(()=>{});P.playing=true}else P.playing=false;songChanged()}
let msOK=false;function mediaInfo(){const s=song(),pl=PLS[P.pl]||{n:''};
 if('mediaSession' in navigator){const ms=navigator.mediaSession;try{ms.metadata=new MediaMetadata({title:s.t||'',artist:s.a||'',album:pl.n||'',artwork:s.cov?[{src:new URL(s.cov,location.href).href}]:[]});ms.playbackState=P.has?(P.playing?'playing':'paused'):'none';
  if(!msOK){msOK=true;ms.setActionHandler('play',()=>{if(AU.paused)act('play')});ms.setActionHandler('pause',()=>{if(!AU.paused)act('play')});ms.setActionHandler('nexttrack',()=>act('next'));ms.setActionHandler('previoustrack',()=>act('prev'));
   try{ms.setActionHandler('seekto',d=>{AU.currentTime=d.seekTime})}catch(e){}}}catch(e){}}
 deskNP()}
function deskNP(){if(!window.cubeDesk||!cubeDesk.np)return;const s=song();let r;if(cubeOn&&!shatter){const h=190*csz;r=[cpos[0]-h,cpos[1]-h,2*h,2*h+60*csz]}else{const R0=SUNR(1)*1.3;r=[side>0?CX-R0:CX,vtop<0?CY:CY-R0,R0,R0]}
 const o={title:P.has?s.t:'Lu Cube',artist:P.has?s.a:'',playing:!!(P.has&&P.playing),rect:r.map(Math.round)},k=JSON.stringify(o);if(k!==deskNP.k){deskNP.k=k;cubeDesk.np(o)}}
ON('play',()=>mediaInfo());ON('pause',()=>mediaInfo());setInterval(deskNP,1000);
if(window.cubeDesk&&cubeDesk.onMedia)cubeDesk.onMedia(k=>act(k));
function songChanged(){const s=song();if(typeof keepInView==='function')keepInView();loadLrc(s);renderFaces();wheelNow();mediaInfo();saveState()}
// crossfade / gapless: the next song starts on the other player while this one fades out.
// Movements of the same piece run straight into each other; other songs use the FADE setting (off, 2 s or 5 s).
function nextIsMovement(){const pl=PLS[P.pl];if(SHUF||!pl||pl.fav||P.idx+1>=pl.songs.length)return false;const a=pl.songs[P.idx],b=pl.songs[P.idx+1];return !!a.a&&a.a===b.a}
setInterval(()=>{const now=performance.now();
 if(SLEEP){const rem=SLEEP.end-Date.now();sleepF=rem<8000?Math.max(0,rem/8000):1;if(rem<=0){SLEEP=null;sleepF=1;stopXf();AU.pause();renderFaces()}}
 if(xf&&now-xf.t0>=xf.dur){xf.old.pause();xf.old.removeAttribute('src');xf.old.load();xf=null}
 mix();
 if(!xf&&P.has&&P.playing&&!AU.paused&&isFinite(AU.duration)&&AU.duration>8){const gap=nextIsMovement(),lead=gap?.25:XF;if(lead>0&&AU.duration-AU.currentTime<=lead){
  const n=nextIdx(),old=AU;AU=AU2;AU2=old;P.idx=n;P.el=0;AU.src=song().src;AU.volume=0;xf={old,t0:now,dur:gap?250:XF*1000};AU.play().catch(()=>{});songChanged()}}},50);
ON('timeupdate',()=>{P.el=AU.currentTime;tickFaces()});
ON('loadedmetadata',()=>{const s=song();if(isFinite(AU.duration))s.d=AU.duration;renderFaces();wheelNow()});
// shuffle: plays every song in the playlist once in a random order before repeating; ⏮ goes back through what it played
let SHUF=false,BAG=[],HIST=[];
function nextIdx(back){const L=PLS[P.pl].songs.length;if(!SHUF||L<2)return(P.idx+(back?L-1:1))%L;
 if(back){const h=HIST.pop();return h&&h.pl===P.pl?h.idx:(P.idx+L-1)%L}
 BAG=BAG.filter(i=>i<L&&i!==P.idx);if(!BAG.length)BAG=[...Array(L).keys()].filter(i=>i!==P.idx);HIST.push({pl:P.pl,idx:P.idx});if(HIST.length>200)HIST.shift();return BAG.splice(Math.floor(Math.random()*BAG.length),1)[0]}
ON('ended',()=>play(P.pl,nextIdx()));
ON('pause',()=>{if(!AU.ended){P.playing=false;renderFaces()}});ON('play',()=>{P.playing=true;renderFaces()});
// ===================== the wheel =====================
const cv=document.getElementById('wheel'),g=cv.getContext('2d'),T=document.getElementById('toks'),ring=document.getElementById('ring'),now=document.getElementById('now'),backB=document.getElementById('back');
let W,Hh,CX,CY,RAD;function size(){const d=Math.min(2,devicePixelRatio||1);W=innerWidth;Hh=innerHeight;cv.width=W*d;cv.height=Hh*d;g.setTransform(d,0,0,d,0,0);CY=Hh*.5}addEventListener('resize',size);size();

function fetchWX(){const pl=ST&&ST.place;if(!pl)return;fetch(`https://api.open-meteo.com/v1/forecast?latitude=${pl.lat}&longitude=${pl.lon}&current=temperature_2m,weather_code&temperature_unit=fahrenheit`).then(r=>r.json()).then(j=>{if(!j.current)return;wxKindNow=wxKind(j.current.weather_code);WXL={clear:'☀',cloud:'☁',fog:'≋',rain:'☂',snow:'❄',storm:'⚡'}[wxKindNow]+' '+Math.round(j.current.temperature_2m)+'°F '+pl.name.toUpperCase();lookNow();renderFaces()}).catch(()=>{})}
let lookKey='';function lookNow(){const h=new Date().getHours(),ph=h<5||h>=20?'night':h<7?'dawn':h<17?'day':'dusk',k=ph+' '+wxKindNow;if(k===lookKey)return;lookKey=k;document.body.className=document.body.className.replace(/\b(ph|wx)-\S+/g,'').trim()+' ph-'+ph+' wx-'+wxKindNow}
setInterval(lookNow,30000);setInterval(fetchWX,15*60000);
let ST={};fetch('/api/state').then(r=>r.json()).catch(()=>({})).then(st=>{ST=st||{};setTimeout(()=>{lookNow();fetchWX()},50);if(typeof st.xf==='number')XF=st.xf;FAVS=st.favs||[];if(typeof st.vol==='number')UVOL=st.vol;mix();SHUF=!!st.shuf}).finally(()=>fetch('/api/library').then(r=>r.json()).then(L=>{
 const n=L.playlists.reduce((x,p)=>x+p.tracks.length,0);document.getElementById('libinfo').textContent=n?`${L.playlists.length} playlists · ${n} songs. Hover the right edge to open the wheel; drag it out for the cube.`:`Your Music folder is empty: ${L.music}. Run Get Classical Music.bat, or drop folders of songs in there.`;
 if(!applyLib(L,true)){requestAnimationFrame(frame);return}
 // pick up where you left off: same song and spot (paused), same sun corner, same cube size and place
 const u=ST.ui||{};if(typeof u.csz==='number')csz=Math.max(.2,Math.min(1.6,u.csz));if(DISPLAYS&&u.dock<DISPLAYS.length)dockD=u.dock;if(u.side===1||u.side===-1){side=u.side;now.style.textAlign=side>0?'right':'left'}if(u.vtop===1||u.vtop===-1)vtop=u.vtop;
 const l=ST.last;if(l&&l.src){let i=PLS.findIndex(p=>p.n===l.pl&&p.songs.some(x=>x.src===l.src));if(i<0)i=PLS.findIndex(p=>p.songs.some(x=>x.src===l.src));if(i>=0)play(i,PLS[i].songs.findIndex(x=>x.src===l.src),l.t||0,true)}
 requestAnimationFrame(frame);if(u.cube&&typeof u.x==='number')setTimeout(()=>{if(!cubeOn)toCube(u.x,u.y)},300)}));
</script></body></html>
